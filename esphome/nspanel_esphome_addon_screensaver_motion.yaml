#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME ADDON - Screensaver Color                                                         #####
##### Local customization (TeeJS fork): optional color-cycling screensaver clock.               #####
#####                                                                                           #####
##### Motion (DVD bounce) was removed: the NSPanel's Nextion Discovery display cannot move      #####
##### components at runtime and has no double-buffering, so repositioning the clock flickers     #####
##### badly. Recoloring the existing centered component in place is a managed redraw, so it      #####
##### stays smooth.                                                                             #####
#####                                                                                           #####
##### Controlled from Home Assistant, per panel:                                               #####
#####   Select  "Screensaver Color Mode" : Off / Cycle color                                    #####
#####   Number  "Screensaver Color Speed": how fast the color cycles                            #####
##### Default mode is Off, so nothing changes until selected in HA.                             #####
#####################################################################################################

---
substitutions:
  TAG_SS_MOTION: nspanel.screensaver.color
  SS_MODE_OFF: "Off"
  SS_MODE_CYCLE: "Cycle color"

esphome:
  platformio_options:
    build_flags:
      - -D NSPANEL_EASY_ADDON_SCREENSAVER_MOTION

globals:
  # Current hue (0-360) for the color cycle.
  - id: ss_hue
    type: float
    restore_value: false
    initial_value: '0.0f'
  # Last RGB565 pushed to the clock, to skip redundant recolors.
  - id: ss_last_color
    type: uint16_t
    restore_value: false
    initial_value: '0xFFFF'

select:
  - id: screensaver_color_mode
    name: Screensaver Color Mode
    platform: template
    options:
      - ${SS_MODE_OFF}
      - ${SS_MODE_CYCLE}
    initial_option: ${SS_MODE_OFF}
    optimistic: true
    restore_value: true
    entity_category: config
    icon: mdi:palette
    update_interval: never
    on_value:
      then:
        - lambda: |-
            // Leaving Cycle mode: restore the configured static color so the clock
            // doesn't stay stuck on the last cycled hue.
            if (x != "${SS_MODE_CYCLE}"
                and current_page_id == get_page_id("screensaver")
                and id(screensaver_display_time)) {
              disp1->send_command_printf("text.pco=%u", id(screensaver_display_time_color));
              id(ss_last_color) = id(screensaver_display_time_color);
            }

number:
  - id: screensaver_color_speed
    name: Screensaver Color Speed
    platform: template
    entity_category: config
    min_value: 1
    max_value: 100
    initial_value: 20
    step: 1
    restore_value: true
    optimistic: true
    icon: mdi:speedometer
    update_interval: never

interval:
  # Cycles the clock's color in place while the screensaver shows the time in Cycle mode.
  # Recoloring the component (text.pco) is a managed redraw, so no motion / no flicker.
  - interval: 200ms
    then:
      - lambda: |-
          if (current_page_id != get_page_id("screensaver")) return;
          if (!id(screensaver_display_time)) return;
          if (id(screensaver_color_mode)->state != "${SS_MODE_CYCLE}") return;

          const float cspeed = id(screensaver_color_speed)->state;  // 1..100
          id(ss_hue) += cspeed * 0.12f;                             // deg per 200 ms tick
          while (id(ss_hue) >= 360.0f) id(ss_hue) -= 360.0f;

          // HSV (S=V=1) -> RGB -> RGB565
          const float h = id(ss_hue);
          const float xx = 1.0f - fabsf(fmodf(h / 60.0f, 2.0f) - 1.0f);
          float r = 0, g = 0, b = 0;
          if      (h <  60.0f) { r = 1;  g = xx; b = 0;  }
          else if (h < 120.0f) { r = xx; g = 1;  b = 0;  }
          else if (h < 180.0f) { r = 0;  g = 1;  b = xx; }
          else if (h < 240.0f) { r = 0;  g = xx; b = 1;  }
          else if (h < 300.0f) { r = xx; g = 0;  b = 1;  }
          else                 { r = 1;  g = 0;  b = xx; }
          const uint8_t R = (uint8_t)(r * 255.0f);
          const uint8_t G = (uint8_t)(g * 255.0f);
          const uint8_t B = (uint8_t)(b * 255.0f);
          const uint16_t color = ((R & 0xF8) << 8) | ((G & 0xFC) << 3) | (B >> 3);

          if (color == id(ss_last_color)) return;   // no visible change; skip recolor
          id(ss_last_color) = color;
          disp1->send_command_printf("text.pco=%u", color);
